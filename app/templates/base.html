<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if refresh %}<meta http-equiv="refresh" content="{{ refresh }}">{% endif %}
<title>{{ site_name }}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.png">
</head>
<body>
<div class="wrap">
  {% if logo_url %}
  <header class="top brand"><span></span><h1><img class="logo" src="{{ logo_url }}" alt="{{ site_name }}"></h1>
    <div class="right">{% block topright %}{% endblock %}</div></header>
  {% else %}
  <header class="top"><h1>{{ site_name }}</h1>{{ self.topright() }}</header>
  {% endif %}
  <div class="wave"></div>
  {% block body %}{% endblock %}
  {% if support_text %}<footer>{{ support_text }}</footer>{% endif %}
</div>
</body>
</html>
